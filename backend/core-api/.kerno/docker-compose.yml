services:
  mongo:
    image: mongo:8.0
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    environment:
      - MONGO_INITDB_ROOT_USERNAME=test_user
      - MONGO_INITDB_ROOT_PASSWORD=test_password
      - MONGO_INITDB_DATABASE=test_db
    tmpfs:
      - /data/db
    ports:
      - "27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --username $MONGO_INITDB_ROOT_USERNAME --password $MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 })\" --quiet || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - external-url=mongodb://localhost:{{PORT}}/test_db?user=test_user&password=test_password

  redis:
    image: redis:8.4.0-alpine
    pull_policy: missing
    ports:
      - "6379"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10
    tmpfs:
      - /data
    labels:
      - external-url=redis://localhost:{{PORT}}

  elasticsearch:
    image: elasticsearch:8.11.0
    pull_policy: missing
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    ports:
      - "9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    tmpfs:
      - /usr/share/elasticsearch/data
    labels:
      - external-url=http://localhost:{{PORT}}

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile_inline: |
        # Base image
        FROM node:22-alpine AS base
        WORKDIR /app
        RUN npm install -g pnpm

        # Build stage
        FROM base AS builder
        WORKDIR /app
        # Copy root manifests
        COPY package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json nx.json ./
        # Copy source code
        COPY backend/core-api ./backend/core-api
        COPY backend/erxes-api-shared ./backend/erxes-api-shared
        
        # Install all dependencies
        RUN pnpm install --frozen-lockfile
        
        # Build both packages
        RUN cd backend/erxes-api-shared && pnpm run build
        RUN cd backend/core-api && pnpm run build

        # Dependencies (production only)
        FROM base AS deps
        # Copy root manifests
        COPY package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json nx.json ./
        # Copy only the package.json files for selective deps resolution
        COPY backend/core-api/package.json backend/core-api/
        COPY backend/erxes-api-shared/package.json backend/erxes-api-shared/

        # Install only production dependencies
        RUN pnpm install --prod --frozen-lockfile

        # Runtime image
        FROM base AS runtime
        WORKDIR /app

        # Copy package manifests first
        COPY --from=builder /app/package.json ./
        COPY --from=builder /app/pnpm-lock.yaml ./
        COPY --from=builder /app/pnpm-workspace.yaml ./
        COPY --from=builder /app/tsconfig.base.json ./
        COPY --from=builder /app/nx.json ./
        
        # Copy built artifacts from builder
        COPY --from=builder /app/backend/core-api/dist ./backend/core-api/dist
        COPY --from=builder /app/backend/erxes-api-shared/dist ./backend/erxes-api-shared/dist
        COPY --from=builder /app/backend/core-api/package.json ./backend/core-api/
        COPY --from=builder /app/backend/erxes-api-shared/package.json ./backend/erxes-api-shared/
        # Copy entrypoint files for erxes-api-shared subpath exports
        COPY --from=builder /app/backend/erxes-api-shared/utils ./backend/erxes-api-shared/utils
        COPY --from=builder /app/backend/erxes-api-shared/core-types ./backend/erxes-api-shared/core-types
        COPY --from=builder /app/backend/erxes-api-shared/core-modules ./backend/erxes-api-shared/core-modules

        # Copy production node_modules from deps stage
        COPY --from=deps /app/node_modules ./node_modules
        COPY --from=deps /app/backend/core-api/node_modules ./backend/core-api/node_modules
        COPY --from=deps /app/backend/erxes-api-shared/node_modules ./backend/erxes-api-shared/node_modules

        # Environment & security
        ENV NODE_ENV=production
        USER 1000

        # Run app
        WORKDIR /app/backend/core-api
        CMD ["node", "dist/src/main.js"]
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "4000"
    labels:
      - jwt-signing-config=HS256:${JWT_TOKEN_SECRET}
