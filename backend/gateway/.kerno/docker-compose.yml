services:
  mongodb:
    image: mongo:8.0
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    environment:
      - MONGO_INITDB_ROOT_USERNAME=test_user
      - MONGO_INITDB_ROOT_PASSWORD=test_password
      - MONGO_INITDB_DATABASE=erxes
    tmpfs:
      - /data/db
    ports:
      - "27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --username $MONGO_INITDB_ROOT_USERNAME --password $MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 })\" --quiet || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - external-url=mongodb://localhost:{{PORT}}/erxes?user=test_user&password=test_password

  redis:
    image: redis:8.4.0-alpine
    pull_policy: missing
    ports:
      - "6379"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10
    tmpfs:
      - /data
    labels:
      - external-url=redis://localhost:{{PORT}}

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile_inline: |
        # Base image for building
        FROM --platform=linux/amd64 node:22-bookworm AS build

        WORKDIR /app

        # Copy root files
        COPY ./package.json ./pnpm-lock.yaml ./pnpm-workspace.yaml ./tsconfig.base.json ./nx.json /app/

        # Copy service-specific package.json files
        COPY ./backend/gateway/package.json /app/backend/gateway/
        COPY ./backend/erxes-api-shared/package.json /app/backend/erxes-api-shared/

        # Install pnpm and dependencies
        RUN npm install -g pnpm
        RUN pnpm install

        # Copy source files
        COPY ./backend/gateway /app/backend/gateway
        COPY ./backend/erxes-api-shared /app/backend/erxes-api-shared

        # Disable Nx daemon (not needed in CI/builds)
        ENV NX_DAEMON=false

        # Build erxes-api-shared first (dependency)
        WORKDIR /app/backend/erxes-api-shared
        RUN npx nx build erxes-api-shared || true

        # Build gateway project
        WORKDIR /app/backend/gateway
        RUN npx nx build:packageJson gateway
        RUN npx nx build gateway

        # Final image
        FROM --platform=linux/amd64 node:22-bookworm AS gateway

        WORKDIR /app

        # Install required packages
        RUN apt-get update && apt-get install -y curl ca-certificates

        # Copy built app from build stage
        COPY --chown=1000:1000 --from=build /app /app

        # Install pnpm
        RUN npm install -g pnpm

        # Set PNPM env
        ENV PNPM_HOME="/root/.local/share/pnpm"
        ENV PATH="$PNPM_HOME:$PATH"

        # Install Rover CLI for composing supergraph
        RUN apt-get update -y \
            && apt-get install -y curl ca-certificates \
            && rm -rf /var/lib/apt/lists/* \
            && npm install -g @apollo/rover@0.22.0 \
            && rover supergraph compose --config /app/backend/gateway/src/apollo-router/dummy/supergraph.yaml --elv2-license=accept

        # Create Apollo Router folder
        RUN mkdir -p /app/backend/gateway/dist/src/apollo-router/temp 

        # Download Apollo Router binary safely
        RUN cd /app/backend/gateway/dist/src/apollo-router/temp \
            && export VERSION=v1.59.2 \
            && curl -sSL https://router.apollo.dev/download/nix/v1.59.2 | sh

        WORKDIR /app/backend/gateway/dist

        ENV NODE_ENV=production

        # Start app
        CMD ["node", "src/main.js"]
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "4000"
    labels:
      - jwt-signing-config=HS256:this_is_a_secret_meeting_all_requirements_of_any_hs_algorithms
